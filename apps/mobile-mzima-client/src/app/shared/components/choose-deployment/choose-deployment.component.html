<app-main-layout
  #layout
  class="main"
  [isSearch]="true"
  [title]="'deployment.title' | translate"
  [header]="isProfile"
  (back)="backHandle()"
  (search)="searchDeployments($event)"
  (searchFocus)="isSearchView = true"
  (searchBlur)="isSearchView = false"
  [ngClass]="{ 'main--profile': isProfile, 'main--search-view': isSearchView }"
>
  <img
    *ngIf="!isProfile"
    class="logo"
    [ngClass]="{ 'logo--hidden': isSearchView }"
    src="assets/saferworld-logo.png"
    alt="Saferworld"
  />
  <ng-container *ngIf="deploymentList.length && !isSearchView">
    <ion-text color="medium" class="title ion-padding-horizontal">
      {{ 'deployment.choose_one' | translate }}
    </ion-text>
    <ion-list class="deployment-list">
      <app-deployment-item
        *ngFor="let item of deploymentList"
        [deployment]="item"
        (selectedDeployment)="callModal($event)"
        [isCurrent]="item.id === currentDeploymentId"
        (click)="chooseDeployment(item)"
      ></app-deployment-item>
    </ion-list>
  </ng-container>
  <ng-container *ngIf="isSearchView">
    <ng-container *ngIf="!isDeploymentsLoading; else spinner">
      <ng-container *ngIf="foundedDeploymentList.length; else emptyList">
        <ion-text color="medium" class="title">
          {{ 'deployment.found_items' | translate : { count: foundedDeploymentList.length } }}
        </ion-text>
        <ion-list class="search-list" [ngStyle]="{ background: 'none' }">
          <app-deployment-item
            class="search-result"
            *ngFor="let item of foundedDeploymentList"
            [deployment]="item"
            [buttonVisible]="false"
            [checkboxVisible]="true"
            [isBackgroundVisible]="false"
            [isBorderVisible]="false"
            (selectedDeployment)="selectDeployment($event)"
          ></app-deployment-item>
        </ion-list>
      </ng-container>
      <ng-template #emptyList>
        <ion-text class="empty" color="medium">
          <span [innerHTML]="'deployment.empty_search' | translate"></span>
        </ion-text>
      </ng-template>
    </ng-container>
  </ng-container>

  <ion-footer class="footer ion-padding" footer *ngIf="isSearchView && addButtonVisible">
    <app-button (buttonClick)="addDeployment()" iconName="plus">{{
      'common.add' | translate
    }}</app-button>
  </ion-footer>
</app-main-layout>

<ng-template #spinner>
  <app-spinner class="spinner"></app-spinner>
</ng-template>
