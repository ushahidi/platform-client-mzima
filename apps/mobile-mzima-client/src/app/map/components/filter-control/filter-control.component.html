<ion-item
  button
  class="filter-control"
  lines="none"
  (click)="handleClick($event)"
  [disabled]="disabled"
>
  <app-icon slot="start" class="filter-control__icon" [name]="filter.icon"></app-icon>
  <div class="filter-control__main">
    <span class="filter-control__title">{{ filter.label | translate }}</span>
    <span class="filter-control__info">
      {{ filter.selectedLabel ?? 'map.selected_filters' | translate }}
      {{ filter.selected ?? '' | translate }}
    </span>
  </div>
  <div slot="end" class="filter-control__controls">
    <ion-text class="filter-control__badge" color="primary">
      {{ filter.options?.length || filter.selectedCount }}
    </ion-text>
    <app-icon class="filter-control__details" name="arrow-right"></app-icon>
  </div>
</ion-item>
